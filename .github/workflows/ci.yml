name: Xatnys CI/CD

on:
  push:
    branches:
      - '*'
      - '!staging.tmp'
    tags:
      - '*'
  schedule:
    - cron: '40 3 * * *'  
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Code Check
    strategy:
      fail-fast: false
      matrix:
        platform: [
          ubuntu-latest,
          macos-latest,
          windows-latest
        ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly

      - name: Install Rust Components
        run: |
          rustup component add rust-src llvm-tools-preview
          rustup target add x86_64-unknown-none

      - name: Configure Cargo for `build-std`
        run: |
          mkdir -p .cargo
          echo '[unstable]' > .cargo/config.toml
          echo 'build-std = ["core", "alloc"]' >> .cargo/config.toml

      - name: Run `cargo check`
        run: cargo check --target x86_64-unknown-none

  test:
    name: Build & Test Kernel
    strategy:
      fail-fast: false
      matrix:
        platform: [
          ubuntu-latest,
          macos-latest,
          windows-latest
        ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly

      - name: Install Rust Components
        run: |
          rustup component add rust-src llvm-tools-preview
          rustup target add x86_64-unknown-none

      - name: Configure Cargo for `build-std`
        run: |
          mkdir -p .cargo
          echo '[unstable]' > .cargo/config.toml
          echo 'build-std = ["core", "alloc"]' >> .cargo/config.toml

      - name: Install Bootimage
        run: cargo install bootimage --debug

      - name: Build Kernel
        run: cargo run --target x86_64-unknown-none

      - name: Run `cargo bootimage`
        run: cargo bootimage --target x86_64-unknown-none

      # Install QEMU for testing
      - name: Install QEMU (Linux)
        run: sudo apt update && sudo apt install qemu-system-x86
        if: runner.os == 'Linux'
      - name: Install QEMU (macOS)
        run: brew install qemu
        if: runner.os == 'macOS'
      - name: Install QEMU (Windows)
        run: |
          choco install qemu --version 2021.5.5
          echo "$Env:Programfiles\qemu" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'
        shell: pwsh
      - name: Print QEMU Version
        run: qemu-system-x86_64 --version

      - name: Run Tests
        run: cargo test --target x86_64-unknown-none --no-fail-fast

  check_formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: rustfmt
          override: true

      - name: Run `cargo fmt`
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, rust-src
          override: true

      - name: Run `cargo clippy`
        run: cargo clippy --target x86_64-unknown-none
