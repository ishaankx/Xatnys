name: Xatnys CI/CD

on:
  push:
    branches:
      - Wolve
  pull_request:
    branches:
      - Wolve
  schedule:
    - cron: '40 3 * * *'  # Runs daily at 3:40 AM UTC
  workflow_dispatch:  # Allows manual runs

jobs:
  check:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
      - name: Install `rust-src`
        run: rustup component add rust-src
      - name: Run `cargo check`
        uses: actions-rs/cargo@v1
        with:
          command: check

  test:
    name: Build & Test Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
      - name: Install Bootimage
        run: cargo install bootimage --debug
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Rust Components
        run: rustup component add rust-src llvm-tools-preview

      - name: Install Rust Target (x86_64-unknown-none)
        run: rustup target add x86_64-unknown-none

      - name: Install Rust Source & Required Components
        run: rustup component add rust-src llvm-tools-preview

      - name: Set Up Cargo to Use `build-std`
        run: echo '[unstable]\nbuild-std = ["core", "alloc"]' >> .cargo/config.toml

      - name: Build Kernel
        run: cargo run

      - name: Run `cargo bootimage`
        uses: actions-rs/cargo@v1
        with:
          command: bootimage

      # Install QEMU for testing
      - name: Install QEMU (Linux)
        run: sudo apt update && sudo apt install qemu-system-x86
        if: runner.os == 'Linux'
      - name: Install QEMU (macOS)
        run: brew install qemu
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Install QEMU (Windows)
        run: |
          choco install qemu --version 2021.5.5
          echo "$Env:Programfiles\qemu" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'
        shell: pwsh
      - name: Print QEMU Version
        run: qemu-system-x86_64 --version

      - name: Run Tests
        run: cargo test --no-fail-fast

  check_formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: rustfmt
          override: true
      - name: Run `cargo fmt`
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, rust-src
          override: true
      - name: Run `cargo clippy`
        uses: actions-rs/cargo@v1
        with:
          command: clippy

  deploy:
    name: Deploy Selected Files
    needs: test  # Only runs after tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "ishaankx"
          git config --global user.email "kataraishaan@gmail.com"

      - name: Commit and Push Selected Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout Wolve
          git add <your_files_or_directory>
          git commit -m "Automated deployment from GitHub Actions"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/ishaankx/xatnys.git Wolve
